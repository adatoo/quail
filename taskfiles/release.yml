# The signed, notarized release build (docs/ARCHITECTURE.md §9, ADR D-018),
# as tasks — the same ones a developer runs locally and the Release workflow's
# dmg job runs in CI. Everything is configured through environment variables, so
# a shell and CI secrets drive the same commands:
#
#   Notarization, either (the API key is preferred and wins if both are set):
#     APPLE_API_KEY_PATH, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID   an App Store Connect API key (.p8).
#       Locally these default to the account's key in ~/.appstoreconnect/private_keys,
#       so on the maintainer's Mac no variables are needed.
#     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD                       an Apple ID app-specific password
#   APPLE_TEAM_ID                           default QKAYS6D525
#   APPLE_SIGNING_IDENTITY                  default "Developer ID Application: Arif Datoo (QKAYS6D525)"
#
#   task release:all      archive → export → notarize → staple → verify   (build/export/Quail.app)
#   task release:dmg      package it: build/Quail-<version>.dmg, signed, notarized, stapled (needs create-dmg)
#   task release:notes    this version's CHANGELOG section → release-notes.md
#   task release:appcast  the Sparkle update feed for that DMG → build/appcast.xml
#                         signing key: SPARKLE_ED_PRIVATE_KEY (CI; read from stdin, never written to disk),
#                         else the login keychain (SPARKLE_KEY_ACCOUNT, default "ed25519")
#   task release:cask     the Homebrew cask for that DMG → build/quail.rb (from Config/quail.rb.in)
#   task release:cask:publish   push it to the tap's Casks/quail.rb (TAP_TOKEN in CI, else your git credentials)
#
# Notarization is one task, release:notarize (FILE=… for what to submit).
version: '3'

vars:
  IDENTITY: '{{if .APPLE_SIGNING_IDENTITY}}{{.APPLE_SIGNING_IDENTITY}}{{else}}Developer ID Application: Arif Datoo (QKAYS6D525){{end}}'
  TEAM_ID: '{{if .APPLE_TEAM_ID}}{{.APPLE_TEAM_ID}}{{else}}QKAYS6D525{{end}}'
  ARCHIVE_PATH: '{{.BUILD_DIR}}/Quail.xcarchive'
  EXPORT_PATH: '{{.BUILD_DIR}}/export'
  APP_PATH: '{{.BUILD_DIR}}/export/Quail.app'
  # App Store Connect API key (not secret: the key ID and issuer; the .p8 is the secret).
  API_KEY_ID: '{{if .APPLE_API_KEY_ID}}{{.APPLE_API_KEY_ID}}{{else}}63BL7CBR43{{end}}'
  API_ISSUER_ID: '{{if .APPLE_API_ISSUER_ID}}{{.APPLE_API_ISSUER_ID}}{{else}}f5f3b0d0-389a-499d-b1e8-f475ef9a9206{{end}}'
  API_KEY_PATH: '{{if .APPLE_API_KEY_PATH}}{{.APPLE_API_KEY_PATH}}{{else}}{{.HOME}}/.appstoreconnect/private_keys/AuthKey_{{.API_KEY_ID}}.p8{{end}}'

tasks:
  check:
    desc: Check the credentials and certificate a signed release needs
    cmds:
      - |
        if [ -f '{{.API_KEY_PATH}}' ]; then
          echo "notarization: App Store Connect API key {{.API_KEY_ID}} ({{.API_KEY_PATH}})"
        elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
          echo "notarization: Apple ID $APPLE_ID"
        else
          echo "error: no notarization credentials — no API key at {{.API_KEY_PATH}}," >&2
          echo "       and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD aren't set. See taskfiles/release.yml." >&2
          exit 1
        fi
        if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
          echo "error: no \"Developer ID Application\" certificate in the active keychain." >&2
          echo "       security find-identity -v -p codesigning   # to check" >&2
          exit 1
        fi

  all:
    desc: Archive with Developer ID, export, notarize, staple and verify → build/export/Quail.app
    cmds:
      - task: check
      - task: archive
      - task: export
      - task: notarize
        vars: {FILE: '{{.APP_PATH}}'}
      - task: staple
        vars: {FILE: '{{.APP_PATH}}'}
      - task: verify
      - |
        echo ""
        echo "Done: {{.APP_PATH}} is signed, notarized, and stapled."

  archive:
    desc: Archive Quail (Release) signed with the Developer ID identity — wipes ./build
    cmds:
      - |
        rm -rf '{{.BUILD_DIR}}'
        mkdir -p '{{.BUILD_DIR}}'
        echo "==> 1/4  Archiving (Release, {{.IDENTITY}})..."
        # pipefail (Taskfile.yml) makes an xcodebuild failure fail this step,
        # even piped through xcbeautify.
        xcodebuild archive \
          -project '{{.ROOT_DIR}}/Quail.xcodeproj' \
          -scheme Quail \
          -configuration Release \
          -archivePath '{{.ARCHIVE_PATH}}' \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY='{{.IDENTITY}}' \
          DEVELOPMENT_TEAM='{{.TEAM_ID}}' \
          | {{.PRETTY}}

  export:
    desc: Export a signed .app from the archive
    cmds:
      - |
        echo "==> 2/4  Exporting a signed .app..."
        xcodebuild -exportArchive \
          -archivePath '{{.ARCHIVE_PATH}}' \
          -exportPath '{{.EXPORT_PATH}}' \
          -exportOptionsPlist '{{.ROOT_DIR}}/Config/ExportOptions-DeveloperID.plist' \
          | {{.PRETTY}}
        [ -d '{{.APP_PATH}}' ] || { echo "error: export finished but {{.APP_PATH}} is missing" >&2; exit 1; }

  notarize:
    desc: 'Submit FILE (an .app or .dmg; default the exported app) to Apple''s notary service and wait (1-5 minutes)'
    vars:
      TARGET: '{{if .FILE}}{{.FILE}}{{else}}{{.APP_PATH}}{{end}}'
    cmds:
      - |
        TARGET='{{.TARGET}}'
        [ -e "$TARGET" ] || { echo "error: $TARGET not found" >&2; exit 1; }
        echo "==> Notarizing $(basename "$TARGET") (this typically takes 1-5 minutes)..."
        # An .app is submitted as a zip; a .dmg as itself.
        case "$TARGET" in
          *.app) SUBMIT='{{.BUILD_DIR}}/notarize-upload.zip'; ditto -c -k --keepParent "$TARGET" "$SUBMIT" ;;
          *) SUBMIT="$TARGET" ;;
        esac
        # The one place credentials are chosen: an API key if there is one, else an Apple ID.
        if [ -f '{{.API_KEY_PATH}}' ]; then
          set -- --key '{{.API_KEY_PATH}}' --key-id '{{.API_KEY_ID}}' --issuer '{{.API_ISSUER_ID}}'
        else
          set -- --apple-id "$APPLE_ID" --team-id '{{.TEAM_ID}}' --password "$APPLE_APP_SPECIFIC_PASSWORD"
        fi
        LOG='{{.BUILD_DIR}}/notarize.json'
        xcrun notarytool submit "$SUBMIT" "$@" --wait --output-format json > "$LOG" || true
        [ "$SUBMIT" != "$TARGET" ] && rm -f "$SUBMIT"
        STATUS="$(plutil -extract status raw -o - "$LOG" 2>/dev/null || echo unknown)"
        ID="$(plutil -extract id raw -o - "$LOG" 2>/dev/null || echo unknown)"
        echo "    submission $ID: $STATUS"
        if [ "$STATUS" != "Accepted" ]; then
          # Apple's log names each file that failed and why.
          [ "$ID" != unknown ] && xcrun notarytool log "$ID" "$@" >&2 || cat "$LOG" >&2
          echo "error: notarization of $(basename "$TARGET") was not accepted ($STATUS)" >&2
          exit 1
        fi

  staple:
    desc: Staple the notarization ticket to FILE (default the exported app)
    vars:
      TARGET: '{{if .FILE}}{{.FILE}}{{else}}{{.APP_PATH}}{{end}}'
    cmds:
      - |
        echo "==> Stapling the notarization ticket to $(basename '{{.TARGET}}')..."
        xcrun stapler staple '{{.TARGET}}'

  verify:
    desc: 'Verify signature, Gatekeeper acceptance and the staple (APP=… for another app)'
    vars:
      APP_TO_CHECK: '{{if .APP}}{{.APP}}{{else}}{{.APP_PATH}}{{end}}'
    cmds:
      - |
        echo ""
        echo "Verifying..."
        codesign --verify --deep --strict --verbose=2 '{{.APP_TO_CHECK}}'
        spctl -a -vvv -t exec '{{.APP_TO_CHECK}}'
        xcrun stapler validate '{{.APP_TO_CHECK}}'
        echo "    all checks passed"

  dmg:
    desc: Package the notarized app into build/Quail-<version>.dmg — signed, notarized, stapled (APP=… for another app; needs create-dmg)
    vars:
      APP_TO_PACK: '{{if .APP}}{{.APP}}{{else}}{{.APP_PATH}}{{end}}'
      DMG_PATH:
        sh: |
          v="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" '{{if .APP}}{{.APP}}{{else}}{{.APP_PATH}}{{end}}/Contents/Info.plist' 2>/dev/null || echo unknown)"
          echo '{{.BUILD_DIR}}'"/Quail-$v.dmg"
    preconditions:
      - sh: command -v create-dmg
        msg: 'create-dmg is not installed — brew install create-dmg'
      - sh: test -d '{{.APP_TO_PACK}}'
        msg: '{{.APP_TO_PACK}} not found — run: task release:all'
    cmds:
      - |
        # The DMG is notarized and stapled too, not just the app inside it: a DMG
        # downloaded by a browser or brew is quarantined, and Gatekeeper checks the
        # container when it's opened.
        APP='{{.APP_TO_PACK}}'
        DMG_PATH='{{.DMG_PATH}}'
        rm -f "$DMG_PATH"

        echo "==> Building $DMG_PATH..."
        # create-dmg exits non-zero on the harmless "no volume icon set" case, so its
        # output file, not its exit status, is the check.
        create-dmg \
          --volname "Quail" \
          --app-drop-link 450 150 \
          --icon "Quail.app" 150 150 \
          --window-size 600 300 \
          "$DMG_PATH" \
          "$APP" \
          || true
        [ -f "$DMG_PATH" ] || { echo "error: create-dmg finished but $DMG_PATH is missing" >&2; exit 1; }

        echo "==> Signing the DMG ({{.IDENTITY}})..."
        codesign --sign '{{.IDENTITY}}' --timestamp "$DMG_PATH"
      - task: notarize
        vars: {FILE: '{{.DMG_PATH}}'}
      - task: staple
        vars: {FILE: '{{.DMG_PATH}}'}
      - task: verify:dmg
        vars: {DMG: '{{.DMG_PATH}}'}
      - 'echo "Done: {{.DMG_PATH}}"'

  verify:dmg:
    desc: 'Verify a DMG: signature, notarization staple and Gatekeeper (DMG=…)'
    cmds:
      - |
        DMG='{{.DMG}}'
        [ -f "$DMG" ] || { echo "error: DMG=$DMG not found" >&2; exit 1; }
        codesign --verify --verbose=2 "$DMG"
        xcrun stapler validate "$DMG"
        spctl -a -vvv -t open --context context:primary-signature "$DMG"
        echo "    DMG checks passed"

  notes:
    desc: 'Write a version''s CHANGELOG section to release-notes.md (VERSION=…, default: project.yml''s)'
    env:
      VERSION: '{{.VERSION}}'
      OUT: '{{.OUT}}'
    cmds:
      - |
        [ -n "${VERSION:-}" ] || VERSION="$('{{.TASK_EXE}}' --silent -d '{{.ROOT_DIR}}' version:current)"
        OUT="${OUT:-{{.ROOT_DIR}}/release-notes.md}"
        awk -v v="$VERSION" '
          index($0, "## [" v "]") == 1 { on = 1; next }
          on && /^## \[/ { exit }
          on { print }
        ' '{{.ROOT_DIR}}/CHANGELOG.md' > "$OUT"
        test -s "$OUT" || echo "Release $VERSION." > "$OUT"
        echo "wrote $OUT"

  appcast:
    desc: 'The Sparkle update feed for a release DMG (DMG=…, default build/Quail-<version>.dmg) → build/appcast.xml'
    env:
      VERSION: '{{.VERSION}}'
      DMG: '{{.DMG}}'
    preconditions:
      - sh: test -x '{{.ROOT_DIR}}/Vendor/sparkle/bin/generate_appcast'
        msg: 'Sparkle tools missing — run: task vendor:sparkle'
    cmds:
      - |
        ROOT='{{.ROOT_DIR}}'
        [ -n "${VERSION:-}" ] || VERSION="$('{{.TASK_EXE}}' --silent -d "$ROOT" version:current)"
        [ -n "${DMG:-}" ] || DMG="{{.BUILD_DIR}}/Quail-$VERSION.dmg"
        [ -f "$DMG" ] || { echo "error: $DMG not found — run: task release:dmg" >&2; exit 1; }
        TAG="v$VERSION"
        TOOLS="$ROOT/Vendor/sparkle/bin"
        DIR='{{.BUILD_DIR}}/appcast'
        rm -rf "$DIR" && mkdir -p "$DIR"
        cp "$DMG" "$DIR/"
        # generate_appcast embeds .md files named like the archive as the release notes
        # (the CHANGELOG section for this version).
        VERSION="$VERSION" OUT="$DIR/$(basename "$DMG" .dmg).md" '{{.TASK_EXE}}' --silent -d "$ROOT" release:notes > /dev/null

        set -- \
          --download-url-prefix "https://github.com/adatoo/quail/releases/download/$TAG/" \
          --embed-release-notes \
          --full-release-notes-url "https://github.com/adatoo/quail/releases/tag/$TAG" \
          --link "https://github.com/adatoo/quail" \
          --account "${SPARKLE_KEY_ACCOUNT:-ed25519}"
        echo "==> generating the appcast for $(basename "$DMG")"
        if [ -n "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$TOOLS/generate_appcast" --ed-key-file - "$@" "$DIR"
        else
          "$TOOLS/generate_appcast" "$@" "$DIR"
        fi

        FEED="$DIR/appcast.xml"
        [ -f "$FEED" ] || { echo "error: generate_appcast wrote no appcast.xml" >&2; exit 1; }
        # An unsigned or mis-pointed feed would be silently useless to every installed copy.
        if ! grep -q 'sparkle:edSignature' "$FEED"; then
          echo "error: the appcast has no EdDSA signature, so no installed copy could trust it." >&2
          echo "       If generate_appcast warned that SUPublicEDKey does not match: the signing key" >&2
          echo "       (SPARKLE_ED_PRIVATE_KEY, or the keychain) isn't the one whose public half is" >&2
          echo "       SPARKLE_PUBLIC_ED_KEY in project.yml. Fix that; never ship this release's feed." >&2
          exit 1
        fi
        grep -q "releases/download/$TAG/$(basename "$DMG")" "$FEED" || { echo "error: the appcast doesn't point at $TAG's DMG" >&2; exit 1; }
        cp "$FEED" '{{.BUILD_DIR}}/appcast.xml'
        echo "wrote {{.BUILD_DIR}}/appcast.xml"

  cask:
    desc: 'The Homebrew cask for a release DMG (DMG=…, default build/Quail-<version>.dmg) → build/quail.rb'
    env:
      VERSION: '{{.VERSION}}'
      DMG: '{{.DMG}}'
    cmds:
      - |
        ROOT='{{.ROOT_DIR}}'
        [ -n "${VERSION:-}" ] || VERSION="$('{{.TASK_EXE}}' --silent -d "$ROOT" version:current)"
        [ -n "${DMG:-}" ] || DMG="{{.BUILD_DIR}}/Quail-$VERSION.dmg"
        [ -f "$DMG" ] || { echo "error: $DMG not found — run: task release:dmg (or gh release download v$VERSION)" >&2; exit 1; }
        # The hash brew checks is of the file people download, so hash that file.
        SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
        mkdir -p '{{.BUILD_DIR}}'
        sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA/" "$ROOT/Config/quail.rb.in" > '{{.BUILD_DIR}}/quail.rb'
        if grep -q '@[A-Z0-9]*@' '{{.BUILD_DIR}}/quail.rb'; then
          echo "error: an unfilled placeholder is left in the cask" >&2; exit 1
        fi
        echo "wrote {{.BUILD_DIR}}/quail.rb ($VERSION, sha256 $SHA)"

  cask:publish:
    desc: "Push build/quail.rb to the tap as Casks/quail.rb (TAP_TOKEN for CI, else your git credentials; TAP_URL overrides the repo)"
    env:
      TAP_TOKEN: '{{.TAP_TOKEN}}'
      TAP_URL: '{{.TAP_URL}}'
      VERSION: '{{.VERSION}}'
    cmds:
      - |
        CASK='{{.BUILD_DIR}}/quail.rb'
        [ -f "$CASK" ] || { echo "error: $CASK not found — run: task release:cask" >&2; exit 1; }
        VERSION="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$CASK")"
        TAP_URL="${TAP_URL:-https://github.com/adatoo/homebrew-tap.git}"
        if [ -n "${TAP_TOKEN:-}" ]; then
          # Through the environment, not the URL or argv, so it can't land in a log or .git/config.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')"
        fi
        WORK="$(mktemp -d)"
        trap 'rm -rf "$WORK"' EXIT
        git clone --quiet "$TAP_URL" "$WORK/tap"
        cd "$WORK/tap"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Two releases can land close together, so a rejected push is refetched and retried.
        for attempt in 1 2 3 4 5; do
          git fetch --quiet origin main 2>/dev/null && git checkout --quiet -B main origin/main || git checkout --quiet -B main
          mkdir -p Casks
          cp "$CASK" Casks/quail.rb
          git add Casks/quail.rb
          if git diff --cached --quiet; then
            echo "the tap already has Quail $VERSION — nothing to publish."; exit 0
          fi
          git commit --quiet -m "quail $VERSION"
          if git push --quiet origin HEAD:main; then
            echo "published Quail $VERSION to the tap"; exit 0
          fi
          echo "push rejected (attempt $attempt) — refetching"; sleep $((attempt * 2))
        done
        echo "error: couldn't push to the tap" >&2; exit 1

  import-cert:
    desc: "[CI only] Import the Developer ID certificate into a dedicated build keychain"
    cmds:
      - |
        # Replaces the user's DEFAULT keychain, so it refuses to run outside CI. CI
        # runs on GitHub-hosted runners only (ADR D-031): a fresh VM per job.
        if [ "${GITHUB_ACTIONS:-}" != "true" ] && [ "${QUAIL_ALLOW_KEYCHAIN_REPLACE:-}" != "1" ]; then
          echo "error: release:import-cert replaces your default keychain; it's for CI." >&2
          echo "       Set QUAIL_ALLOW_KEYCHAIN_REPLACE=1 if you really mean it." >&2
          exit 1
        fi
        : "${P12_BASE64:?P12_BASE64 (the base64 .p12) is not set}"
        : "${P12_PASSWORD:?P12_PASSWORD is not set}"
        echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
        security create-keychain -p actions build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p actions build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
        # Grants codesign non-interactive access to the imported key — without
        # this, every codesign call in a headless CI runner would hang forever on
        # an authorization prompt nothing can answer.
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
        rm /tmp/cert.p12
