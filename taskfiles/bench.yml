# The comparison harness (bench/, ADR D-063): Quail against llama-server, Ollama, oMLX and Rapid-MLX on the same
# weights, with standard benchmarks. Python tooling, run with uv, outside the app — nothing here ships.
#
#   task bench:setup      the tool environments (oMLX, GuideLLM, mlx-lm, lm-eval, BFCL), vendored engines and tools
#   task bench:doctor     what's installed and missing, and how quiet the Mac is
#   task bench:smoke      start each engine with each model and record what it can do (capabilities.json)
#   task bench:speed      the speed benchmark (GuideLLM) on a quieted Mac; BUDGET=quick|night|full
#   task bench:native     the engine-native baselines: llama-bench, llama-batched-bench, mlx_lm.benchmark
#   task bench:quality    GSM8K and MMLU-Pro (lm-eval) through the request shim
#   task bench:tools      BFCL's function-calling categories through the request shim
#   task bench:compare    all four in one run folder (RESUME=<run> carries on a stopped one)
#   task bench:report     the report for a compare run: docs/benchmarks/<date>/ (RUN=…, SMOKE=…, NOTES=…)
#   task bench:site       website/compare.html from config/features.toml (and REPORT=<report folder>)
#   task bench:restore    resume anything a killed run left paused (Spotlight, analysis daemons)
#   task bench:test       the harness's own tests (in `task ci`)
#
# ENGINES=quail-gguf,llama-server,…  MODELS=qwen3-8b,…  narrow a run. ALLOW_OTHERS=1 times a Mac that isn't
# quiet (another LLM server running, on battery): a dry run, recorded as one.
version: '3'

tasks:
  setup:
    desc: Make the harness's tool environments and fetch the engines it compares (never part of the app)
    deps: [':vendor:ollama', ':vendor:llama-tools']
    preconditions:
      - sh: command -v uv
        msg: 'uv is not installed — brew install uv'
    cmds:
      - uv sync --locked --project bench/tools/omlx --quiet
      - echo "==> oMLX $(bench/tools/omlx/.venv/bin/python -c 'import importlib.metadata as m; print(m.version("omlx"))') ready"
      - uv sync --locked --project bench/tools/guidellm --quiet
      - echo "==> GuideLLM $(bench/tools/guidellm/.venv/bin/guidellm --version | awk '{print $NF}') ready"
      - uv sync --locked --project bench/tools/mlxlm --quiet
      - echo "==> mlx-lm $(bench/tools/mlxlm/.venv/bin/python -c 'import importlib.metadata as m; print(m.version("mlx-lm"))') ready"
      - uv sync --locked --project bench/tools/lmeval --quiet
      - echo "==> lm-eval $(bench/tools/lmeval/.venv/bin/python -c 'import importlib.metadata as m; print(m.version("lm-eval"))') ready"
      - uv sync --locked --project bench/tools/bfcl --quiet
      - echo "==> BFCL $(bench/tools/bfcl/.venv/bin/python -c 'import importlib.metadata as m; print(m.version("bfcl-eval"))') ready"

  doctor:
    desc: What the comparison harness has and lacks, and how quiet the Mac is
    dir: bench
    cmds:
      - uv run --quiet python -m harness doctor

  smoke:
    desc: Start each engine with each model and record what it can really do (bench/runs/<run>/capabilities.json)
    dir: bench
    env:
      ENGINES: '{{.ENGINES}}'
      MODELS: '{{.MODELS}}'
    cmds:
      - |
        args=()
        [ -n "${ENGINES:-}" ] && args+=(--engines "$ENGINES")
        [ -n "${MODELS:-}" ] && args+=(--models "$MODELS")
        uv run --quiet python -m harness smoke "${args[@]}"

  speed:
    desc: The speed benchmark — GuideLLM against each engine, the same prompts for all (bench/runs/<run>/speed.jsonl)
    dir: bench
    env:
      ENGINES: '{{.ENGINES}}'
      MODELS: '{{.MODELS}}'
      BUDGET: '{{.BUDGET | default "quick"}}'
      ALLOW_OTHERS: '{{.ALLOW_OTHERS}}'
    cmds:
      - |
        args=(--budget "$BUDGET")
        [ -n "${ENGINES:-}" ] && args+=(--engines "$ENGINES")
        [ -n "${MODELS:-}" ] && args+=(--models "$MODELS")
        [ -n "${ALLOW_OTHERS:-}" ] && args+=(--allow-others)
        PYTHONUNBUFFERED=1 uv run --quiet python -m harness speed "${args[@]}"

  native:
    desc: The engine-native baselines — llama-bench, llama-batched-bench and mlx_lm.benchmark on the same weights
    dir: bench
    env:
      MODELS: '{{.MODELS}}'
      BUDGET: '{{.BUDGET | default "quick"}}'
      ALLOW_OTHERS: '{{.ALLOW_OTHERS}}'
    cmds:
      - |
        args=(--budget "$BUDGET")
        [ -n "${MODELS:-}" ] && args+=(--models "$MODELS")
        [ -n "${ALLOW_OTHERS:-}" ] && args+=(--allow-others)
        PYTHONUNBUFFERED=1 uv run --quiet python -m harness native "${args[@]}"

  quality:
    desc: GSM8K and MMLU-Pro with lm-eval, through the request shim (bench/runs/<run>/quality.jsonl)
    dir: bench
    env:
      ENGINES: '{{.ENGINES}}'
      MODELS: '{{.MODELS}}'
      BUDGET: '{{.BUDGET | default "quick"}}'
      ALLOW_OTHERS: '{{.ALLOW_OTHERS}}'
    cmds:
      - |
        args=(--budget "$BUDGET")
        [ -n "${ENGINES:-}" ] && args+=(--engines "$ENGINES")
        [ -n "${MODELS:-}" ] && args+=(--models "$MODELS")
        [ -n "${ALLOW_OTHERS:-}" ] && args+=(--allow-others)
        PYTHONUNBUFFERED=1 uv run --quiet python -m harness quality "${args[@]}"

  tools:
    desc: BFCL's function-calling categories, through the request shim (bench/runs/<run>/tools.jsonl)
    dir: bench
    env:
      ENGINES: '{{.ENGINES}}'
      MODELS: '{{.MODELS}}'
      BUDGET: '{{.BUDGET | default "quick"}}'
      ALLOW_OTHERS: '{{.ALLOW_OTHERS}}'
    cmds:
      - |
        args=(--budget "$BUDGET")
        [ -n "${ENGINES:-}" ] && args+=(--engines "$ENGINES")
        [ -n "${MODELS:-}" ] && args+=(--models "$MODELS")
        [ -n "${ALLOW_OTHERS:-}" ] && args+=(--allow-others)
        PYTHONUNBUFFERED=1 uv run --quiet python -m harness tools "${args[@]}"

  compare:
    desc: Speed, native baselines, quality and tool calling in one run folder; RESUME=<run> carries on
    dir: bench
    env:
      ENGINES: '{{.ENGINES}}'
      MODELS: '{{.MODELS}}'
      BUDGET: '{{.BUDGET | default "quick"}}'
      ALLOW_OTHERS: '{{.ALLOW_OTHERS}}'
      RESUME: '{{.RESUME}}'
    cmds:
      - |
        args=(--budget "$BUDGET")
        [ -n "${ENGINES:-}" ] && args+=(--engines "$ENGINES")
        [ -n "${MODELS:-}" ] && args+=(--models "$MODELS")
        [ -n "${ALLOW_OTHERS:-}" ] && args+=(--allow-others)
        [ -n "${RESUME:-}" ] && args+=(--resume "$RESUME")
        PYTHONUNBUFFERED=1 uv run --quiet python -m harness compare "${args[@]}"

  report:
    desc: The report for a compare run — docs/benchmarks/<date>/ (RUN=<run folder>, SMOKE=<smoke folder>, NOTES=<toml>)
    dir: bench
    requires:
      vars: [RUN]
    env:
      RUN: '{{.RUN}}'
      SMOKE: '{{.SMOKE}}'
      NOTES: '{{.NOTES}}'
    cmds:
      - |
        args=("$RUN")
        [ -n "${SMOKE:-}" ] && args+=(--smoke "$SMOKE")
        [ -n "${NOTES:-}" ] && args+=(--notes "$(cd "{{.USER_WORKING_DIR}}" && realpath "$NOTES")")
        uv run --quiet python -m harness report "${args[@]}"

  site:
    desc: Write website/compare.html — the sourced feature table (config/features.toml) and, with REPORT=…, its results
    dir: bench
    env:
      REPORT: '{{.REPORT}}'
    cmds:
      - |
        args=()
        [ -n "${REPORT:-}" ] && args+=(--report "$REPORT")
        uv run --quiet python -m harness site "${args[@]}"

  restore:
    desc: Resume whatever a killed benchmark run left paused (Spotlight indexing, analysis daemons)
    dir: bench
    cmds:
      - uv run --quiet python -m harness restore

  test:
    desc: The comparison harness's own tests (parsers, configuration, launch settings)
    dir: bench
    cmds:
      - uv run --quiet python -m unittest discover -s harness/tests -t . -q
