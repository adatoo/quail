# The Xcode "Run Script" build phases (project.yml's postbuildScripts) — each
# one is `task embed:<name>`. They read the environment Xcode gives a build
# phase (SRCROOT, CODESIGNING_FOLDER_PATH, EXPANDED_CODE_SIGN_IDENTITY,
# CONFIGURATION, BUILT_PRODUCTS_DIR, CODE_SIGNING_ALLOWED) and do nothing useful
# outside one.
version: '3'

tasks:
  llama:
    desc: "[Xcode phase] Embed llama-server + dylibs and the llama.cpp licence and tag into the app, signed"
    cmds:
      - |
        # Copies the vendored llama-server and its dylibs into Contents/MacOS and
        # signs each one with the identity Xcode resolved for this build ("sign
        # inside-out", docs/ARCHITECTURE.md §9). If Vendor/llama.cpp isn't
        # populated yet, that's a no-op with a warning, so a fresh checkout still
        # builds the app shell.
        : "${SRCROOT:?embed:llama runs from an Xcode build phase (SRCROOT is not set)}"
        : "${CODESIGNING_FOLDER_PATH:?embed:llama runs from an Xcode build phase}"
        VENDOR="${SRCROOT}/Vendor/llama.cpp"
        DEST="${CODESIGNING_FOLDER_PATH}/Contents/MacOS"

        if [ ! -d "$VENDOR" ] || [ ! -f "$VENDOR/llama-server" ]; then
          echo "warning: Vendor/llama.cpp not found — run: task vendor:llama, then rebuild. Quail will have no bundled runtime until then."
          exit 0
        fi

        mkdir -p "$DEST"
        # No --delete: Contents/MacOS also holds the app's own executable (Quail),
        # which must not be touched by this phase.
        rsync -a --exclude 'LICENSE-llama.cpp' "$VENDOR"/ "$DEST"/
        mkdir -p "${CODESIGNING_FOLDER_PATH}/Contents/Resources"
        cp "$VENDOR/LICENSE-llama.cpp" "${CODESIGNING_FOLDER_PATH}/Contents/Resources/LICENSE-llama.cpp"
        # The tag Settings → General → About shows. Copied from the pin vendor:llama
        # downloads, not from a second place to keep in sync (a build with no pin
        # file just shows "—").
        [ -f "${SRCROOT}/Vendor/llama.version" ] && cp "${SRCROOT}/Vendor/llama.version" "${CODESIGNING_FOLDER_PATH}/Contents/Resources/llama.version"

        if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
          echo "note: CODE_SIGNING_ALLOWED=NO — ad-hoc signing embedded llama.cpp binaries."
          SIGN_ARGS=(--force --sign -)
        elif [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
          SIGN_ARGS=(--force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime)
          # A secure timestamp is a network round-trip to Apple, needed only for
          # notarization — not on every local Debug build (Config/LocalSigning.xcconfig).
          case "${CONFIGURATION:-}" in
            Release*) SIGN_ARGS+=(--timestamp) ;;
          esac
        else
          SIGN_ARGS=(--force --sign -)
        fi

        SIGNED=0
        for src in "$VENDOR"/*.dylib "$VENDOR/llama-server"; do
          [ -e "$src" ] || continue
          f="$DEST/$(basename "$src")"
          [ -e "$f" ] && [ ! -L "$f" ] || continue
          codesign "${SIGN_ARGS[@]}" "$f"
          SIGNED=$((SIGNED + 1))
        done

        echo "embed:llama: staged and signed $SIGNED files from Vendor/llama.cpp into $DEST"

        # The library quail-server's GGUF engine links (ADR D-043). Thinned to arm64 (shipped builds
        # are Apple silicon only) and signed like the rest; quail-server finds it through the
        # @executable_path/../Frameworks rpath project.yml gives it.
        FRAMEWORK="${SRCROOT}/Vendor/llama.xcframework/macos-arm64_x86_64/llama.framework"
        if [ -d "$FRAMEWORK" ]; then
          FDEST="${CODESIGNING_FOLDER_PATH}/Contents/Frameworks/llama.framework"
          mkdir -p "${CODESIGNING_FOLDER_PATH}/Contents/Frameworks"
          rm -rf "$FDEST"
          cp -a "$FRAMEWORK" "$FDEST"
          lipo "$FDEST/Versions/A/llama" -thin arm64 -output "$FDEST/Versions/A/llama.thin"
          mv "$FDEST/Versions/A/llama.thin" "$FDEST/Versions/A/llama"
          codesign "${SIGN_ARGS[@]}" "$FDEST"
          echo "embed:llama: staged and signed llama.framework into Contents/Frameworks"
        else
          echo "warning: Vendor/llama.xcframework not found — run: task vendor:llama. quail-server won't start without it."
        fi

  cli:
    desc: "[Xcode phase] Copy the quail CLI into Quail.app/Contents/Helpers, signed (direct build only)"
    cmds:
      - |
        # Skipped for the App Store build: a sandboxed Store app can't ship a
        # command-line tool the user runs outside the sandbox.
        : "${CODESIGNING_FOLDER_PATH:?embed:cli runs from an Xcode build phase}"
        : "${BUILT_PRODUCTS_DIR:?embed:cli runs from an Xcode build phase}"
        case "${CONFIGURATION:-}" in
          *AppStore*)
            echo "embed:cli: App Store build — no CLI"
            exit 0
            ;;
        esac

        SRC="${BUILT_PRODUCTS_DIR}/quail"
        DEST="${CODESIGNING_FOLDER_PATH}/Contents/Helpers"
        if [ ! -f "$SRC" ]; then
          echo "warning: ${SRC} not built — the quail CLI won't be in this app"
          exit 0
        fi
        mkdir -p "$DEST"
        cp -f "$SRC" "$DEST/quail"

        if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
          codesign --force --sign - "$DEST/quail"
        elif [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
          ARGS=(--force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime --identifier com.datoos.quail.cli)
          case "${CONFIGURATION:-}" in Release*) ARGS+=(--timestamp) ;; esac
          codesign "${ARGS[@]}" "$DEST/quail"
        else
          codesign --force --sign - "$DEST/quail"
        fi
        echo "embed:cli: staged and signed quail into $DEST"

  server:
    desc: "[Xcode phase] Copy quail-server into Quail.app/Contents/MacOS, signed (both builds)"
    cmds:
      - |
        # Unlike the CLI it ships in the App Store build too — it needs no Python
        # and no executable-code download (docs/ARCHITECTURE.md §2).
        : "${CODESIGNING_FOLDER_PATH:?embed:server runs from an Xcode build phase}"
        : "${BUILT_PRODUCTS_DIR:?embed:server runs from an Xcode build phase}"
        SRC="${BUILT_PRODUCTS_DIR}/quail-server"
        DEST="${CODESIGNING_FOLDER_PATH}/Contents/MacOS"
        if [ ! -f "$SRC" ]; then
          echo "warning: ${SRC} not built — quail-server won't be in this app"
          exit 0
        fi
        mkdir -p "$DEST"
        cp -f "$SRC" "$DEST/quail-server"

        # The MLX engine's Metal shaders (ADR D-044): mlx-swift builds them into a SwiftPM resource
        # bundle. Inside an app the library looks for it in Contents/Resources (the main bundle of a
        # tool in Contents/MacOS is the app); a bare mlx.metallib in Contents/MacOS would also load
        # but codesign refuses an unsigned file there. A server that can't find the shaders aborts the
        # whole process on the first MLX model load, so a missing bundle fails the build.
        MLXBUNDLE="${BUILT_PRODUCTS_DIR}/mlx-swift_Cmlx.bundle"
        if [ ! -f "$MLXBUNDLE/Contents/Resources/default.metallib" ]; then
          echo "error: $MLXBUNDLE has no default.metallib — was the Metal Toolchain installed? (xcodebuild -downloadComponent MetalToolchain)" >&2
          exit 1
        fi
        MLXDEST="${CODESIGNING_FOLDER_PATH}/Contents/Resources/mlx-swift_Cmlx.bundle"
        mkdir -p "${CODESIGNING_FOLDER_PATH}/Contents/Resources"
        rm -rf "$MLXDEST" "$DEST/mlx-swift_Cmlx.bundle" "$DEST/mlx.metallib"
        # -L: in an archive build the product is a symlink, and copying the link would leave nothing to sign.
        cp -RL "$MLXBUNDLE" "$MLXDEST"

        if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
          codesign --force --sign - "$MLXDEST"
          codesign --force --sign - "$DEST/quail-server"
        elif [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
          ARGS=(--force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime)
          case "${CONFIGURATION:-}" in Release*) ARGS+=(--timestamp) ;; esac
          codesign "${ARGS[@]}" "$MLXDEST"
          codesign "${ARGS[@]}" --identifier com.datoos.quail.server "$DEST/quail-server"
        else
          codesign --force --sign - "$MLXDEST"
          codesign --force --sign - "$DEST/quail-server"
        fi
        echo "embed:server: staged and signed quail-server into $DEST"
