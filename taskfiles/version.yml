# Quail's versioning (ADR D-024): the version lives in project.yml as
# MARKETING_VERSION (SemVer) and CURRENT_PROJECT_VERSION (the build number,
# +1 per release). Every PR carries its own bump, matching its Conventional
# Commits title.
#
# INPUT COMES FROM ENVIRONMENT VARIABLES, NEVER FROM TEMPLATED TEXT. A PR title
# is attacker-controlled, and Task pastes {{.VARS}} and {{.CLI_ARGS}} into the
# shell command — a title of `$(…)` would run. So:
#
#   PR_TITLE="feat: x" task version:check      # yes
#   task version:check -- "feat: x"            # no such thing, deliberately
#
# Values reach the shell as plain environment variables, which are inert.
#
#   task version:current | version:build          the version / build in project.yml
#   task version:main-current | version:main-build   the same, from origin/main
#   PR_TITLE=… [PR_BODY=…] task version:level     patch | minor | major
#   LEVEL=… VERSION=… task version:next           the next version
#   PR_TITLE=… task version:valid-title           exit 0 if a Conventional Commits title
#   PR_TITLE=… [PR_BODY=…] task version:check     is this branch's bump the one the title calls for?
#   PR_TITLE=… [PR_BODY=…] task version:bump      make it so (or TARGET=patch|minor|major|X.Y.Z)
#   task version:test                             the tests for all of the above
#
# QUAIL_ROOT points them at another checkout; QUAIL_BASE_VERSION / QUAIL_BASE_BUILD
# skip reading origin/main (the tests use all three); QUAIL_SKIP_XCODEGEN skips
# regenerating the project after a bump.
version: '3'

vars:
  # Shell functions every version task starts with. Kept in one place so the
  # arithmetic exists once (it was version.sh).
  LIB: |
    ROOT='{{.ROOT_DIR}}'
    ROOT="${QUAIL_ROOT:-$ROOT}"
    TYPES="feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style"

    read_key() { # key file
      sed -nE "s/^[[:space:]]*$1:[[:space:]]*\"?([^\"]*)\"?[[:space:]]*$/\1/p" "$2" | head -1
    }

    main_key() { # key — read from origin/main's project.yml
      local tmp value
      tmp="$(mktemp)"
      git -C "$ROOT" show origin/main:project.yml > "$tmp"
      value="$(read_key "$1" "$tmp")"
      rm -f "$tmp"
      echo "$value"
    }

    # NOT `${QUAIL_BASE_VERSION:-$(main_key …)}`: Task's shell runs the fallback
    # command even when the variable is set (bash doesn't), which here would run
    # `git show origin/main` in a checkout that has none.
    base_version() {
      if [ -n "${QUAIL_BASE_VERSION:-}" ]; then echo "$QUAIL_BASE_VERSION"; else main_key MARKETING_VERSION; fi
    }

    base_build() {
      if [ -n "${QUAIL_BASE_BUILD:-}" ]; then echo "$QUAIL_BASE_BUILD"; else main_key CURRENT_PROJECT_VERSION; fi
    }

    valid_title() {
      [[ "$1" =~ ^($TYPES)(\([^\)]+\))?!?:\ .+ ]]
    }

    level() { # title [body]
      local title="$1" body="${2:-}"
      valid_title "$title" || { echo "invalid"; return 1; }
      if [[ "$title" =~ ^[a-z]+(\([^\)]+\))?!: ]] || grep -q '^BREAKING[ -]CHANGE:' <<< "$body"; then
        echo major
      elif [[ "$title" =~ ^feat(\(|:|!) ]]; then
        echo minor
      else
        echo patch
      fi
    }

    next() { # level version
      local lvl="$1" v="$2" major minor patch
      [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "not a version: $v" >&2; return 1; }
      major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
      # SemVer's pre-1.0 convention: while 0.x, a breaking change bumps minor.
      # 1.0.0 is a deliberate `TARGET=1.0.0 task version:bump`.
      if [[ "$lvl" == major && "$major" == 0 ]]; then
        lvl=minor
      fi
      case "$lvl" in
        major) echo "$((major + 1)).0.0" ;;
        minor) echo "$major.$((minor + 1)).0" ;;
        patch) echo "$major.$minor.$((patch + 1))" ;;
        *) echo "unknown level: $lvl" >&2; return 1 ;;
      esac
    }

tasks:
  current:
    desc: The version in project.yml (PROJECT_FILE=… for another file)
    env:
      PROJECT_FILE: '{{.PROJECT_FILE}}'
    cmds:
      - |
        {{.LIB}}
        read_key MARKETING_VERSION "${PROJECT_FILE:-$ROOT/project.yml}"

  build:
    desc: The build number in project.yml (PROJECT_FILE=… for another file)
    env:
      PROJECT_FILE: '{{.PROJECT_FILE}}'
    cmds:
      - |
        {{.LIB}}
        read_key CURRENT_PROJECT_VERSION "${PROJECT_FILE:-$ROOT/project.yml}"

  main-current:
    desc: The version on origin/main
    cmds:
      - |
        {{.LIB}}
        main_key MARKETING_VERSION

  main-build:
    desc: The build number on origin/main
    cmds:
      - |
        {{.LIB}}
        main_key CURRENT_PROJECT_VERSION

  level:
    desc: 'patch | minor | major for PR_TITLE (and PR_BODY)'
    cmds:
      - |
        {{.LIB}}
        level "${PR_TITLE:?set PR_TITLE}" "${PR_BODY:-}"

  next:
    desc: 'The next version: LEVEL=patch|minor|major VERSION=X.Y.Z'
    env:
      LEVEL: '{{.LEVEL}}'
      VERSION: '{{.VERSION}}'
    cmds:
      - |
        {{.LIB}}
        next "${LEVEL:?set LEVEL}" "${VERSION:?set VERSION}"

  valid-title:
    desc: Exit 0 if PR_TITLE is a Conventional Commits title
    cmds:
      - |
        {{.LIB}}
        valid_title "${PR_TITLE:?set PR_TITLE}"

  check:
    desc: 'The PR version check: this branch must carry exactly the bump PR_TITLE calls for'
    cmds:
      - |
        {{.LIB}}
        title="${PR_TITLE:?PR_TITLE is required (the pull request title)}"
        body="${PR_BODY:-}"

        fail() {
          echo "::error::$1"
          echo
          echo "Fix: PR_TITLE=\"$title\" task version:bump   (then commit and push)"
          exit 1
        }

        valid_title "$title" \
          || fail "PR title isn't a Conventional Commits title: type(scope): summary — types: feat fix perf refactor docs test build ci chore revert style; add ! for a breaking change."

        base="$(base_version)"
        base_build="$(base_build)"
        lvl="$(level "$title" "$body")"
        expected="$(next "$lvl" "$base")"
        actual="$(read_key MARKETING_VERSION "$ROOT/project.yml")"
        build="$(read_key CURRENT_PROJECT_VERSION "$ROOT/project.yml")"

        echo "main is $base (build $base_build); \"$title\" is a $lvl change → expected $expected; this branch has $actual (build $build)."

        # 1.0.0 is a deliberate step (TARGET=1.0.0 task version:bump), accepted from 0.x.
        if [ "$actual" != "$expected" ] && ! [[ "$actual" == 1.0.0 && "$base" == 0.* ]]; then
          fail "project.yml's version is $actual; a $lvl change from $base should be $expected."
        fi
        [ "$build" -gt "$base_build" ] || fail "CURRENT_PROJECT_VERSION ($build) must be greater than main's ($base_build)."
        grep -q "^## \[$actual\]" "$ROOT/CHANGELOG.md" || fail "CHANGELOG.md has no \"## [$actual]\" section."
        if git -C "$ROOT" rev-parse -q --verify "refs/tags/v$actual" > /dev/null 2>&1 \
          || git -C "$ROOT" ls-remote --exit-code --tags origin "refs/tags/v$actual" > /dev/null 2>&1; then
          fail "Tag v$actual already exists."
        fi
        echo "Version OK: $actual"

  bump:
    desc: "Bump the version for this PR (PR_TITLE, or TARGET=patch|minor|major|X.Y.Z), cut the CHANGELOG, regenerate the project"
    env:
      TARGET: '{{.TARGET}}'
    cmds:
      - |
        {{.LIB}}
        PROJECT="$ROOT/project.yml"
        CHANGELOG="$ROOT/CHANGELOG.md"
        title="${PR_TITLE:-}"
        body="${PR_BODY:-}"
        target="${TARGET:-}"

        if [ -z "$title" ] && [ -z "$target" ]; then
          echo "usage: PR_TITLE=\"feat: …\" [PR_BODY=…] task version:bump      (bump from the PR title)" >&2
          echo "       TARGET=patch|minor|major|X.Y.Z task version:bump     (bump explicitly)" >&2
          exit 64
        fi

        if [ -z "${QUAIL_BASE_VERSION:-}" ]; then
          git -C "$ROOT" fetch -q origin main 2>/dev/null || true
        fi
        base="$(base_version)"
        base_build="$(base_build)"

        if [ -n "$title" ]; then
          lvl="$(level "$title" "$body")" || {
            echo "error: \"$title\" isn't a Conventional Commits title (type(scope): summary; types: feat fix perf refactor docs test build ci chore revert style)" >&2
            exit 1
          }
          new="$(next "$lvl" "$base")"
        elif [[ "$target" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          new="$target"
        else
          new="$(next "$target" "$base")"
        fi
        new_build=$((base_build + 1))
        current="$(read_key MARKETING_VERSION "$PROJECT")"

        perl -0pi -e "s/(MARKETING_VERSION:\s*)\"?[0-9.]+\"?/\${1}\"$new\"/; s/(CURRENT_PROJECT_VERSION:\s*)\"?[0-9]+\"?/\${1}\"$new_build\"/" "$PROJECT"

        # CHANGELOG: re-running after main moved renames this branch's own section;
        # otherwise [Unreleased] becomes [new] under a fresh, empty [Unreleased].
        today="$(date +%Y-%m-%d)"
        if grep -q "^## \[$new\]" "$CHANGELOG"; then
          : # already cut
        elif [ "$current" != "$base" ] && grep -q "^## \[$current\]" "$CHANGELOG" \
          && ! git -C "$ROOT" show origin/main:CHANGELOG.md 2>/dev/null | grep -q "^## \[$current\]"; then
          perl -pi -e "s/^## \\[\Q$current\E\\] - .*/## [$new] - $today/" "$CHANGELOG"
        else
          perl -0pi -e "s/^## \\[Unreleased\\][ \\t]*\\n/## [Unreleased]\\n\\n## [$new] - $today\\n/m" "$CHANGELOG"
        fi

        if [ -z "${QUAIL_SKIP_XCODEGEN:-}" ] && command -v xcodegen > /dev/null; then
          (cd "$ROOT" && xcodegen generate --quiet)
        fi

        echo "$base → $new (build $new_build)"

  test:
    desc: Tests for the versioning tasks (no network; works on a temp copy)
    cmds:
      - |
        T() { '{{.TASK_EXE}}' --silent -d '{{.ROOT_DIR}}' "$@"; }
        failures=0

        eq() { # description expected actual
          if [ "$2" == "$3" ]; then
            echo "ok   $1"
          else
            echo "FAIL $1: expected '$2', got '$3'"
            failures=$((failures + 1))
          fi
        }
        ok() { # description command...
          local d="$1"; shift
          if "$@" > /dev/null 2>&1; then echo "ok   $d"; else echo "FAIL $d"; failures=$((failures + 1)); fi
        }
        not() { # description command...
          local d="$1"; shift
          if "$@" > /dev/null 2>&1; then echo "FAIL $d (should have failed)"; failures=$((failures + 1)); else echo "ok   $d"; fi
        }

        # Each helper exports its input in a subshell, so it reaches the task as a
        # plain environment variable — the way CI hands it a PR title.
        next()  { ( export LEVEL="$1" VERSION="$2"; T version:next ); }
        level() { ( export PR_TITLE="$1" PR_BODY="${2:-}"; T version:level ); }
        title_ok() { ( export PR_TITLE="$1"; T version:valid-title ); }

        # --- SemVer arithmetic
        eq "patch" 1.2.4 "$(next patch 1.2.3)"
        eq "minor resets patch" 1.3.0 "$(next minor 1.2.3)"
        eq "major resets minor and patch" 2.0.0 "$(next major 1.2.3)"
        eq "major while 0.x bumps minor" 0.3.0 "$(next major 0.2.5)"
        eq "minor while 0.x" 0.3.0 "$(next minor 0.2.5)"
        not "rejects a non-version" next patch 1.2

        # --- Title → level
        eq "feat → minor" minor "$(level 'feat: add benchmark')"
        eq "feat(scope) → minor" minor "$(level 'feat(bench): add benchmark')"
        eq "fix → patch" patch "$(level 'fix: runaway poll')"
        for type in perf refactor docs test build ci chore revert style; do
          eq "$type → patch" patch "$(level "$type: something")"
        done
        eq "chore(deps) → patch" patch "$(level 'chore(deps): bump actions/checkout from 6 to 7')"
        eq "! → major" major "$(level 'feat!: new control protocol')"
        eq "scope + ! → major" major "$(level 'fix(cli)!: rename bench flags')"
        eq "BREAKING CHANGE in body → major" major "$(level 'fix: x' $'Some text\nBREAKING CHANGE: y')"
        not "no type" title_ok 'Add benchmark'
        not "unknown type" title_ok 'feature: add benchmark'
        not "missing space" title_ok 'feat:add'
        ok "valid title" title_ok 'feat(release): SemVer releases'

        # --- Input is data, never code: a hostile title must not run anything.
        canary="$(mktemp -u)"
        level "feat: x \$(touch $canary) \`touch $canary\` ; touch $canary" > /dev/null 2>&1 || true
        title_ok 'fix: {{"{{"}} .X }} $(touch '"$canary"')' > /dev/null 2>&1 || true
        eq "a hostile title runs nothing" "no" "$([ -e "$canary" ] && echo yes || echo no)"
        rm -f "$canary"

        # --- Reading project.yml
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        cat > "$tmp/project.yml" << 'YML'
        settings:
          base:
            SWIFT_VERSION: 6.0
            MARKETING_VERSION: "0.4.1"
            CURRENT_PROJECT_VERSION: "7"
        YML
        cat > "$tmp/CHANGELOG.md" << 'MD'
        # Changelog

        ## [Unreleased]

        ### Added

        - A thing.

        ## [0.4.1] - 2026-01-01

        - Older.
        MD
        cur() { ( export PROJECT_FILE="$tmp/project.yml"; T version:current ); }
        bld() { ( export PROJECT_FILE="$tmp/project.yml"; T version:build ); }
        eq "reads the version" 0.4.1 "$(cur)"
        eq "reads the build" 7 "$(bld)"

        # --- Bump and check, end to end on the temp copy
        # The temp checkout stands in for the repo, with main pinned at 0.4.1 (build 7).
        on_temp() { export QUAIL_ROOT="$tmp" QUAIL_BASE_VERSION=0.4.1 QUAIL_BASE_BUILD=7 QUAIL_SKIP_XCODEGEN=1; }
        bump()  { ( on_temp; export PR_TITLE="$1"; T version:bump ); }
        check() { ( on_temp; export PR_TITLE="$1"; T version:check ); }

        not "check fails before a bump" check 'feat: a thing'
        bump 'feat: a thing' > /dev/null
        eq "bump sets the version" 0.5.0 "$(cur)"
        eq "bump sets build = main's + 1" 8 "$(bld)"
        eq "CHANGELOG gets a fresh Unreleased above the new section" \
          "## [Unreleased]|## [0.5.0] - $(date +%Y-%m-%d)|## [0.4.1] - 2026-01-01" \
          "$(grep '^## ' "$tmp/CHANGELOG.md" | paste -sd '|' -)"
        eq "the entries moved into the new section" 1 \
          "$(awk '/^## \[0.5.0\]/{f=1;next} /^## /{f=0} f && /A thing/' "$tmp/CHANGELOG.md" | wc -l | tr -d ' ')"
        ok "check passes after the bump" check 'feat: a thing'
        not "check fails when the title says a different level" check 'fix: a thing'
        not "check fails on an invalid title" check 'A thing'

        # Title changed to fix: re-running re-targets instead of double-bumping.
        bump 'fix: a thing' > /dev/null
        eq "re-bump re-targets" 0.4.2 "$(cur)"
        eq "re-bump keeps one build step" 8 "$(bld)"
        eq "re-bump renames this branch's section" 1 "$(grep -c '^## \[0.4.2\]' "$tmp/CHANGELOG.md")"
        eq "…and leaves no stale one" 0 "$(grep -c '^## \[0.5.0\]' "$tmp/CHANGELOG.md")"
        ok "check passes for the new title" check 'fix: a thing'

        ( on_temp; export TARGET=1.0.0; T version:bump ) > /dev/null
        ok "1.0.0 is accepted from 0.x whatever the title" check 'feat: one point oh'

        echo
        if [ "$failures" -gt 0 ]; then
          echo "$failures failure(s)"
          exit 1
        fi
        echo "All versioning tests passed."
