name: Quail
options:
  bundleIdPrefix: com.datoos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release
  Debug-AppStore: debug
  Release-AppStore: release

packages:
  # ADR D-032: the in-app updater (direct build only — see Quail/App/Updater.swift).
  # Pinned exactly: an updater is code Quail runs with the user's privileges.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # ADR D-022: the quail CLI's argument parsing — linked into QuailCLI only.
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2

  # ADR D-028/D-035: quail-server's chat-template renderer (QuailServerCore only). The
  # collections pin is D-028's: 1.7.0 built by Xcode 27 doesn't launch on macOS 26.
  Jinja:
    url: https://github.com/huggingface/swift-jinja
    exactVersion: 2.5.1
  Collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.3.0

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.18.0"
    CURRENT_PROJECT_VERSION: "27"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Arif Datoo. MIT Licence."
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    # Shipped builds are Apple silicon only: the bundled llama-server is arm64-only
    # and MLX (Phase 3) needs Apple silicon, so an x86_64 slice can't run the server.
    Release:
      ARCHS: arm64
    Release-AppStore:
      ARCHS: arm64

targets:
  Quail:
    type: application
    platform: macOS
    sources:
      - path: Quail
      # Shared with the quail CLI (the control protocol, socket, SSE parser).
      - path: Shared
    dependencies:
      - package: Sparkle
      # Built first so "Embed quail CLI" can copy it into Contents/Helpers.
      - target: QuailCLI
        embed: false
        link: false
      # Same for the server: "Embed quail-server" copies it into Contents/MacOS.
      - target: QuailServer
        embed: false
        link: false
    # Debug builds sign with a developer's own identity when they've set
    # one up — see Config/LocalSigning.xcconfig for why (Keychain prompt).
    configFiles:
      Debug: Config/LocalSigning.xcconfig
      Debug-AppStore: Config/LocalSigning.xcconfig
    # A real, XcodeGen-written Info.plist, not GENERATE_INFOPLIST_FILE:
    # confirmed empirically that INFOPLIST_KEY_<CustomKey> only works
    # for Apple-recognized keys — an arbitrary one like QuailCatalogURL
    # (below) never made it into the generated plist. Quail/Info.plist
    # is written by `xcodegen generate` from `properties:` here (same
    # as Quail.xcodeproj, don't hand-edit it — it gets overwritten) and
    # committed, restating every key GENERATE_INFOPLIST_FILE used to
    # carry (LSUIElement, the copyright/category strings, display name)
    # plus the new one.
    info:
      path: Quail/Info.plist
      properties:
        CFBundleDisplayName: Quail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Arif Datoo. MIT Licence."
        LSApplicationCategoryType: "public.app-category.developer-tools"
        # CatalogRefresher.remoteURL(in:) reads this — this repo's own
        # catalog.json on `main`, so a catalog update ships with a
        # plain `git push` instead of a signed app release. Revision-
        # gated (CatalogRefresher never accepts a lower revision than
        # what's already bundled), so a bad push can't degrade the app
        # below its own shipped seed.
        QuailCatalogURL: "https://raw.githubusercontent.com/adatoo/quail/main/Quail/Resources/catalog.json"
        # Sparkle (ADR D-032). The feed is the appcast.xml each release attaches;
        # `releases/latest` always redirects to the newest full release.
        SUFeedURL: "https://github.com/adatoo/quail/releases/latest/download/appcast.xml"
        # The public half of the EdDSA key that signs every update. The private half
        # lives in the maintainer's keychain and in the SPARKLE_ED_PRIVATE_KEY secret.
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        # Settings → General → Updates is the choice, so no first-launch "check
        # automatically?" prompt: checks are on (daily) until the user says otherwise.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Ask before installing, unless the user opts in to automatic installs.
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datoos.quail
        PRODUCT_NAME: Quail
        GENERATE_INFOPLIST_FILE: NO
        # The public half of the update-signing key (`generate_keys`; the private half is in the
        # maintainer's keychain and the SPARKLE_ED_PRIVATE_KEY secret). Override on the command
        # line to test with another. ADR D-032.
        SPARKLE_PUBLIC_ED_KEY: "oH+v2DZA8LRTu8SzGsRJSLwZAvyxRgppOiVU5eZ6xC0="
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          CODE_SIGN_ENTITLEMENTS: Quail/Quail.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Quail/Quail.entitlements
        Debug-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG APPSTORE"
          CODE_SIGN_ENTITLEMENTS: Quail/Quail-AppStore.entitlements
        Release-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE"
          CODE_SIGN_ENTITLEMENTS: Quail/Quail-AppStore.entitlements
    postbuildScripts:
      - name: "Embed llama.cpp"
        script: |
          # The embed step is a task (taskfiles/embed.yml). Xcode's PATH is minimal,
          # so add Homebrew's; a missing go-task fails the build, because an app
          # without its embedded runtime is broken.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v task > /dev/null || { echo "error: go-task is required to build Quail — brew install go-task"; exit 1; }
          task -d "$SRCROOT" embed:llama
        basedOnDependencyAnalysis: false
      - name: "Embed quail CLI"
        script: |
          # The embed step is a task (taskfiles/embed.yml). Xcode's PATH is minimal,
          # so add Homebrew's; a missing go-task fails the build, because an app
          # without its embedded runtime is broken.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v task > /dev/null || { echo "error: go-task is required to build Quail — brew install go-task"; exit 1; }
          task -d "$SRCROOT" embed:cli
        basedOnDependencyAnalysis: false
      - name: "Embed quail-server"
        script: |
          # The embed step is a task (taskfiles/embed.yml). Xcode's PATH is minimal,
          # so add Homebrew's; a missing go-task fails the build, because an app
          # without its embedded runtime is broken.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v task > /dev/null || { echo "error: go-task is required to build Quail — brew install go-task"; exit 1; }
          task -d "$SRCROOT" embed:server
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - QuailTests
      config: Debug

  # The `quail` command-line tool (docs/IMPLEMENTATION_PLAN.md Phase 2b) —
  # a thin client of the running app over ControlProtocol. Shipped inside
  # Quail.app at Contents/Helpers/quail (not Contents/MacOS: on a
  # case-insensitive disk "quail" would collide with the app's own "Quail").
  QuailCLI:
    type: tool
    platform: macOS
    sources:
      - path: QuailCLI
      - path: Shared
    dependencies:
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: quail
        # The executable is `quail`, but the Swift module can't be: on a
        # case-insensitive disk "quail" collides with the app's "Quail"
        # module ("cannot load module 'quail' as 'Quail'").
        PRODUCT_MODULE_NAME: QuailCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.datoos.quail.cli
        SKIP_INSTALL: YES
    configFiles:
      Debug: Config/LocalSigning.xcconfig
      Debug-AppStore: Config/LocalSigning.xcconfig

  # The server's code (ADR D-027): HTTP layer, model router, engine seam,
  # routes. A static library so QuailTests can import it; the executable
  # below is one line on top. No third-party dependencies yet — MLX and
  # libllama arrive with their engines (Phase 3 steps 4 and 5).
  QuailServerCore:
    type: library.static
    platform: macOS
    sources:
      - path: QuailServer/Core
    dependencies:
      - package: Jinja
      - package: Collections
        product: OrderedCollections
    settings:
      base:
        PRODUCT_NAME: QuailServerCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Debug-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG APPSTORE"
        Release-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE"

  # `quail-server`, shipped at Quail.app/Contents/MacOS in both builds (it
  # needs no Python). The version comes from an Info.plist linked into the
  # binary, so `--version` can't drift from the app (ADR D-024).
  QuailServer:
    type: tool
    platform: macOS
    sources:
      - path: QuailServer/Main
    dependencies:
      - target: QuailServerCore
      # A static library doesn't carry its package products to whatever links it.
      - package: Jinja
      - package: Collections
        product: OrderedCollections
    settings:
      base:
        PRODUCT_NAME: quail-server
        PRODUCT_MODULE_NAME: QuailServerMain
        PRODUCT_BUNDLE_IDENTIFIER: com.datoos.quail.server
        SKIP_INSTALL: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Debug-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG APPSTORE"
        Release-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE"
    configFiles:
      Debug: Config/LocalSigning.xcconfig
      Debug-AppStore: Config/LocalSigning.xcconfig

  QuailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: QuailTests
    configFiles:
      Debug: Config/LocalSigning.xcconfig
      Debug-AppStore: Config/LocalSigning.xcconfig
    dependencies:
      - target: Quail
        embed: false
      - target: QuailServerCore
      - package: Jinja
      - package: Collections
        product: OrderedCollections
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datoos.quail.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Quail:
    build:
      targets:
        Quail: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuailTests
    archive:
      config: Release

  Quail-AppStore:
    build:
      targets:
        Quail: all
    run:
      config: Debug-AppStore
    test:
      config: Debug-AppStore
      targets:
        - QuailTests
    archive:
      config: Release-AppStore
