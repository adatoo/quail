# Every chat model in the curated catalog, for Quail's own quality and tool-calling scores (ADR D-070):
# QUAIL_BENCH_MODELS=catalog-models with ENGINES=quail-gguf (and quail-mlx for Bonsai 2, which is MLX only).
# Each is its catalog default download. Thinking is off, as for the engine comparison (fairness.toml).
# Gemma 4 31B runs 2 requests at once, not 8: with libllama's full-size sliding-window cache (which Quail keeps), 4 or
# 8 caches of 8K beside its weights ran the M1 Max's GPU out of memory.
# Not here: qwen3-0.6b (smoke test); nomic-embed-v1.5 (embedding model); deepseek-r1-distill-llama-8b (always thinks); deepseek-r1-distill-qwen-32b (always thinks); muse-glimmer-30b (its template has no switch, and it
# thinks before answering).

