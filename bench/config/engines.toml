# The engines compared (ADR D-063) and where each comes from. Every one runs with a scratch HOME and its own
# scratch model and cache folders, so nothing here touches a real Quail, Ollama, oMLX or Rapid-MLX setup.

# Quail's own server, both engines, from a signed Release build (a Debug build is unoptimised Swift and is
# refused). QUAIL_BENCH_APP overrides the path; the first that exists wins.
[quail]
apps = ["~/Apps/Quail.app", "/Applications/Quail.app"]

# The llama-server bundled in the same app: the GGUF lane's reference.
[llama-server]

# Ollama's official build (not Homebrew's, which builds MLX against Homebrew's mlx-c), fetched and
# checked by `task vendor:ollama`.
[ollama]
version = "0.34.4"
sha256 = "e9c8fddaab5f48f47f2c4ae3d23d0732f5182417125353faeed2188e34a22799"

# oMLX from its release wheel, in bench/tools/omlx (`task bench:setup`). Needs macOS 15 or later.
[omlx]
version = "0.6.4"

# Rapid-MLX as installed (Homebrew). `bench:doctor` records its version and the MLX it runs on.
[rapid-mlx]
command = "rapid-mlx"
