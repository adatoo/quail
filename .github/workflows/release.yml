name: Release

# Every merge to main is a release (ADR D-024): the PR already carried its
# SemVer bump (version.yml checked it), so this tags the merge commit
# vX.Y.Z and publishes a GitHub Release with that version's CHANGELOG
# section. Releases are full releases, not pre-releases, even while 0.x:
# Sparkle and Homebrew find the newest one through GitHub's releases/latest,
# which skips pre-releases (ADR D-031).
#
# The signed, notarized DMG (docs/ARCHITECTURE.md §9, ADR D-018) is built
# and attached only when vars.SIGNING_ENABLED is 'true' — set it once the
# Apple signing secrets are in the repo. Every step is a task from
# Taskfile.yml (ADR D-030) — the same release:* tasks a developer runs
# locally via `task install:notarized`.
#
# The last job updates the Homebrew cask in adatoo/homebrew-tap (ADR D-033),
# from the DMG as published, so the hash brew checks is of what people download.
#
# Triggered by the push a merge makes. Merges must be made as a person or
# as the quail-release App (auto-merge.yml, ADR D-046) — a merge made with
# GITHUB_TOKEN starts no workflows.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: tag-and-release
    runs-on: ubuntu-latest # tags and notes only; no Xcode needed
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          version="$(task version:current)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version already exists — nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG
        if: steps.version.outputs.created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: task release:notes

      - name: Tag and publish
        if: steps.version.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Quail $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          # With signing on, the release becomes "latest" only once its DMG and update feed are
          # attached (the dmg job does that): releases/latest/download/appcast.xml is what installed
          # copies fetch, and until the feed exists it answers 404, which Sparkle shows as
          # "An error occurred in retrieving update information".
          if [ "$SIGNING_ENABLED" = "true" ]; then latest="--latest=false"; else latest="--latest"; fi
          gh release create "v$VERSION" --title "Quail $VERSION" --notes-file release-notes.md "$latest"

  dmg:
    name: sign-and-attach-dmg
    needs: tag
    if: needs.tag.outputs.created == 'true' && vars.SIGNING_ENABLED == 'true'
    # GitHub-hosted: a fresh VM per run, so release:import-cert replacing the
    # default keychain touches nothing that outlives the job (ADR D-031).
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.tag.outputs.version }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      # mlx-swift compiles its Metal shaders during the build (ADR D-028/D-044); on Xcode 26 the
      # Metal Toolchain is a separate download (about 840 MB) when the image doesn't carry it.
      - name: Metal Toolchain
        run: |
          if xcrun --find metal > /dev/null 2>&1; then
            echo "Metal Toolchain already installed"
          else
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          # The hosted image has Homebrew but not every tool Quail's tasks use.
          for tool in swiftformat xcodegen xcbeautify create-dmg; do
            command -v "$tool" > /dev/null || brew install "$tool"
          done

      - name: Import Developer ID Application certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: task release:import-cert

      - name: Vendor llama.cpp
        run: task vendor:llama

      - name: Vendor uv
        run: task vendor:uv

      - name: Generate Xcode project
        run: task generate

      - name: App Store Connect API key (for notarization)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Written to the job's temp dir, which is wiped with the VM.
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Sign and notarize the app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: task release:all

      - name: Verify the exported app (Mach-O closure, bundled resources, update key)
        # REQUIRE_UPDATE_KEY: a build whose Info.plist has no Sparkle public key could
        # never verify an update, so it must not ship (ADR D-032).
        run: task verify:bundle APP=build/export/Quail.app REQUIRE_UPDATE_KEY=1

      - name: Build, sign, notarize and staple the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: task release:dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: quail-dmg
          path: build/Quail-*.dmg
          retention-days: 90

      - name: Attach DMG to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          files: build/Quail-*.dmg

      # The update feed installed copies check (SUFeedURL: releases/latest/download/appcast.xml).
      # After the DMG is attached, so a feed problem never blocks the download itself.
      - name: Build the Sparkle update feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_ED_PRIVATE_KEY secret isn't set, so this release has no update feed and installed copies can't update."
            exit 1
          fi
          task vendor:sparkle
          task release:appcast

      - name: Attach the update feed to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          files: build/appcast.xml

      # Only now does releases/latest, and so the feed installed copies read, point here.
      - name: Make it the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: gh release edit "v$VERSION" --latest

  homebrew:
    name: update-homebrew-cask
    needs: [tag, dmg]
    if: needs.tag.outputs.created == 'true' && vars.SIGNING_ENABLED == 'true'
    runs-on: ubuntu-latest # renders a text file and pushes it; no Xcode needed
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.tag.outputs.version }}

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: gh release download "v$VERSION" --pattern "Quail-*.dmg" --dir build

      - name: Render the cask
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: task release:cask

      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::The TAP_TOKEN secret isn't set, so 'brew install' would stay on the previous release."
            exit 1
          fi
          task release:cask:publish
