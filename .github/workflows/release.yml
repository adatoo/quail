name: Release

# Every merge to main is a release (ADR D-024): the PR already carried its
# SemVer bump (version.yml checked it), so this tags the merge commit
# vX.Y.Z and publishes a GitHub Release with that version's CHANGELOG
# section. 0.x releases are pre-releases.
#
# The signed, notarized DMG (docs/ARCHITECTURE.md §9, ADR D-018) is built
# and attached only when vars.SIGNING_ENABLED is 'true' — set it once the
# Apple signing secrets are in the repo. It reuses the same
# scripts/sign-and-notarize.sh and scripts/make-dmg.sh a developer runs
# locally via scripts/install.sh.
#
# Triggered by the push a merge makes. Merges must be made as a person or
# with BOT_TOKEN — a merge made with GITHUB_TOKEN starts no workflows.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: tag-and-release
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(scripts/version.sh current)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version already exists — nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG
        if: steps.version.outputs.created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release $VERSION." > release-notes.md

      - name: Tag and publish
        if: steps.version.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Quail $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          prerelease=()
          case "$VERSION" in 0.*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" --title "Quail $VERSION" --notes-file release-notes.md "${prerelease[@]}"

  dmg:
    name: sign-and-attach-dmg
    needs: tag
    if: needs.tag.outputs.created == 'true' && vars.SIGNING_ENABLED == 'true'
    # vars.MAC_SIGNING_RUNNER (repo variable) moves this job onto a self-hosted
    # Mac. Point it at a runner running as its OWN macOS user: the certificate
    # step below replaces that user's default keychain.
    runs-on: ${{ vars.MAC_SIGNING_RUNNER || 'macos-26' }}
    env:
      DEVELOPER_DIR: ${{ vars.MAC_SIGNING_RUNNER && '/Applications/Xcode.app/Contents/Developer' || '/Applications/Xcode_26.6.app/Contents/Developer' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.tag.outputs.version }}

      - name: Select Xcode
        run: |
          # DEVELOPER_DIR already selects Xcode for every step; the global
          # switch needs passwordless sudo, which only hosted runners have.
          if [ -z "${{ vars.MAC_SIGNING_RUNNER }}" ]; then
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
          xcodebuild -version

      - name: Import Developer ID Application certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          # Grants codesign non-interactive access to the imported key —
          # without this, every codesign call in a headless CI runner
          # would hang forever on an authorization prompt nothing can
          # answer (the exact "Keychain access" annoyance this whole
          # signing setup exists to avoid, applied to CI rather than a
          # developer's own machine).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm /tmp/cert.p12

      - name: Vendor llama.cpp
        run: |
          scripts/vendor-llama.sh
          scripts/verify-macho.sh Vendor/llama.cpp

      - name: Vendor uv
        if: hashFiles('scripts/vendor-uv.sh') != ''
        run: |
          scripts/vendor-uv.sh
          scripts/verify-macho.sh Vendor/uv

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/sign-and-notarize.sh

      - name: Verify embedded Mach-O closure
        run: scripts/verify-macho.sh build/export/Quail.app/Contents/MacOS

      - name: Verify bundled resources
        run: test -f build/export/Quail.app/Contents/Resources/catalog.json

      - name: Build DMG
        run: |
          brew install create-dmg
          scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: quail-dmg
          path: build/Quail-*.dmg
          retention-days: 90

      - name: Attach DMG to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          files: build/Quail-*.dmg
