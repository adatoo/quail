name: Auto-merge

# Turns on auto-merge (merge commit — the only method main allows) for every
# PR, so it merges itself once the required checks pass (ADR D-024, D-046).
#
# Authenticated as the "quail-release" GitHub App, not GITHUB_TOKEN: a merge
# made with GITHUB_TOKEN starts no workflows, so release.yml would never run.
# An App's merge is an ordinary actor event, so `push: main` fires. The App is
# installed on this repo only (Contents + Pull requests: read and write); its
# client ID and private key are the RELEASE_APP_CLIENT_ID and
# RELEASE_APP_PRIVATE_KEY secrets, in both the Actions and the Dependabot
# secret stores (Dependabot's workflows read only the latter).
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  enable:
    name: enable-auto-merge
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check for the App's credentials
        id: creds
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::notice::RELEASE_APP_CLIENT_ID isn't set — enable auto-merge on this PR by hand (gh pr merge --auto --merge)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the App's token
        if: steps.creds.outputs.present == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        if: steps.creds.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
