name: Website

# Publishes website/ to GitHub Pages (ADR D-062): plain HTML and CSS, no build step, so the job only checks the
# links and uploads the folder. Pages must be set to deploy from "GitHub Actions" (Settings → Pages) — this
# workflow doesn't turn it on by itself. The custom domain (quail-ai.app) is a Pages setting plus DNS, not a
# CNAME file: GitHub ignores one when a workflow deploys.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/check-site"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/check-site"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check every page and link
        run: scripts/check-site website

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
