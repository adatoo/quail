name: Dependabot bump

# Dependabot PRs need a version bump like every other PR (ADR D-024): this
# commits a patch bump to the PR branch. Pushed as the quail-release GitHub
# App (ADR D-046) so the push re-runs the required checks (a GITHUB_TOKEN push
# wouldn't). Dependabot's workflows read the Dependabot secret store, so the
# App's RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY must be there.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  bump:
    name: bump-version
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check for the App's credentials
        id: token
        env:
          CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::notice::RELEASE_APP_CLIENT_ID isn't in the Dependabot secrets — bump this PR by hand: TARGET=patch task version:bump"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the App's token
        if: steps.token.outputs.present == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout the PR branch
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Task
        if: steps.token.outputs.present == 'true'
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump and push
        if: steps.token.outputs.present == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if task version:check > /dev/null 2>&1; then
            echo "Already bumped."
            exit 0
          fi
          task version:bump
          git config user.name "quail-release[bot]"
          git config user.email "quail-release[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version for ${PR_TITLE}"
          git push
