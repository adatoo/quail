name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    # vars.MAC_RUNNER (repo variable, e.g. `mac-mini`) moves this job onto the
    # self-hosted Mac runner, which uses its default /Applications/Xcode.app.
    # Unset it to go back to GitHub-hosted macos-26 with the pinned Xcode.
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    env:
      DEVELOPER_DIR: ${{ vars.MAC_RUNNER && '/Applications/Xcode.app/Contents/Developer' || '/Applications/Xcode_26.6.app/Contents/Developer' }}
    # Every step is a task from Taskfile.yml (ADR D-030), so `task ci` on a
    # laptop runs exactly this list. Builds go in ./DerivedData in the workspace,
    # so the Quail.app checks can't pick up a stale build from a shared
    # ~/Library DerivedData on a real Mac.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          # DEVELOPER_DIR already selects Xcode for every step; the global
          # switch needs passwordless sudo, which only hosted runners have.
          if [ -z "${{ vars.MAC_RUNNER }}" ]; then
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
          xcodebuild -version

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: SwiftFormat lint
        run: task lint

      - name: Vendor llama.cpp
        run: task vendor:llama

      - name: Vendor uv
        run: task vendor:uv

      - name: Build (Quail)
        run: task build

      - name: Verify the built app (Mach-O closure, bundled resources)
        run: task verify:bundle

      - name: Test (Quail)
        run: task test

      - name: Build (Quail-AppStore)
        run: task build:appstore
