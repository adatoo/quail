name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: SwiftFormat lint
        run: |
          if find . -name '*.swift' -not -path './Vendor/*' -print -quit | grep -q .; then
            swiftformat --lint .
          else
            echo "No Swift files yet; skipping."
          fi

      - name: Vendor llama.cpp
        if: hashFiles('scripts/vendor-llama.sh') != ''
        run: |
          scripts/vendor-llama.sh
          scripts/verify-macho.sh Vendor/llama.cpp

      - name: Vendor uv
        if: hashFiles('scripts/vendor-uv.sh') != ''
        run: |
          scripts/vendor-uv.sh
          scripts/verify-macho.sh Vendor/uv

      - name: Build (Quail)
        run: |
          if [ -e Quail.xcodeproj ] || [ -e Quail.xcworkspace ]; then
            set -o pipefail
            xcodebuild -scheme Quail -configuration Debug build \
              CODE_SIGNING_ALLOWED=NO | xcbeautify
          else
            echo "No Xcode project yet; skipping build."
          fi

      - name: Verify embedded Mach-O closure
        if: hashFiles('scripts/verify-macho.sh') != '' && hashFiles('Quail.xcodeproj/**') != ''
        run: |
          APP="$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -name 'Quail.app' -path '*/Debug/*' -print -quit)"
          if [ -n "$APP" ] && [ -d "$APP/Contents/MacOS" ]; then
            scripts/verify-macho.sh "$APP/Contents/MacOS"
          else
            echo "Quail.app not found under DerivedData; skipping."
          fi

      - name: Test (Quail)
        run: |
          if [ -e Quail.xcodeproj ] || [ -e Quail.xcworkspace ]; then
            set -o pipefail
            xcodebuild -scheme Quail -configuration Debug test \
              -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO | xcbeautify
          else
            echo "No Xcode project yet; skipping tests."
          fi
