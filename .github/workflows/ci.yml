name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    # GitHub-hosted, never self-hosted: the repo is public, so any fork's PR
    # runs this workflow, and on a self-hosted runner that means on our own
    # Mac (ADR D-031). Standard hosted runners are free for public repos.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # Every step is a task from Taskfile.yml (ADR D-030), so `task ci` on a
    # laptop runs exactly this list.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          # The hosted image has Homebrew but not every tool Quail's tasks use.
          for tool in swiftformat xcodegen xcbeautify; do
            command -v "$tool" > /dev/null || brew install "$tool"
          done

      - name: SwiftFormat lint
        run: task lint

      - name: Vendor llama.cpp
        run: task vendor:llama

      - name: Vendor uv
        run: task vendor:uv

      - name: Build (Quail)
        run: task build

      - name: Verify the built app (Mach-O closure, bundled resources)
        run: task verify:bundle

      - name: Test (Quail)
        run: task test

      - name: Build (Quail-AppStore)
        run: task build:appstore
